[project]
name = "erpnext_pdf_renaming"
authors = [{ name = "Joeryan De Chavez" }]
description = "Private, browser-only invoice PDF renaming page for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "erpnext_pdf_renaming.__version__" }

[tool.setuptools.packages.find]
include = ["erpnext_pdf_renaming*"]

